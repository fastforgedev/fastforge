[package]
name = "fastforge_app_packager"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A unified app packager"
license.workspace = true

[dependencies]
fastforge_core = { path = "../core" }
dmg_maker = { path = "../dmg_maker" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
liquid = "0.26"
zip = "2.2"
flate2 = "1"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"
