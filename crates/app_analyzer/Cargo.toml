[package]
name = "fastforge_app_analyzer"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A unified app builder"
license.workspace = true

[dependencies]
fastforge_core = { path = "../core" }
hex = "0.4"
log = "0.4.28"
plist = "1.7"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps the analysis payload in the order it is assembled,
# which is what makes the printed JSON readable.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
zip = "2.2"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
zip = "2.2"
