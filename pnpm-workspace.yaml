packages:
  - "apps/website"
  - "apps/docs"
  - "apps/studio-*"
  - "packages/studio-*"

allowBuilds:
  # DazzUI is built from this pinned Git revision during installation.
  "@dazzlabs/dazzui@git+https://github.com/dazzlabs/dazzui.git#ec9bc09e7aaaab12896bb934c2bcb75ea7d4ffd6&path:/packages/js/dazzui": true
  esbuild: true
  sharp: true
  workerd: true
  unrs-resolver: true

overrides:
  serialize-javascript: ">=7.0.3"
  uuid: ">=11.1.1"
  js-yaml: ">=4.1.2"
  file-type: ">=21.3.1"
  esbuild: ">=0.28.1"
