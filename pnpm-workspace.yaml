packages:
  - "apps/website"
  - "apps/docs"
  - "apps/studio-*"
  - "packages/studio-*"

allowBuilds:
  # DazzUI is built from this pinned Git revision during installation.
  "@dazzlabs/dazzui@git+https://github.com/dazzlabs/dazzui.git#ec9bc09e7aaaab12896bb934c2bcb75ea7d4ffd6&path:/packages/js/dazzui": true
  esbuild: true
  sharp: true
  workerd: true
  unrs-resolver: true

overrides:
  serialize-javascript: ">=7.0.3"
  uuid: ">=11.1.1"
  js-yaml: "^4.3.2"
  file-type: ">=21.3.1"
  esbuild: ">=0.28.1"
  # Security fixes for transitive dependencies pinned by upstream packages.
  "@xmldom/xmldom": "^0.9.12"
  baseline-browser-mapping: "^2.11.0"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@5": "^5.0.12"
  browserslist: "^4.28.7"
  "nanoid@3": "^3.3.18"
  postcss: "^8.5.23"
  "postcss-selector-parser@6": "^6.1.5"
  seroval: "^1.6.11"
  "miniflare>sharp": "^0.35.5"
  source-map-js: "^1.2.2"
  "undici@7": "^7.30.1"
  "vitepress>vite": "^7.3.7"
  vue: "^3.5.42"
  "zod@4": "^4.6.6"
