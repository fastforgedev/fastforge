[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/app_analyzer",
  "crates/app_builder",
  "crates/app_packager",
  "crates/app_publisher",
  "crates/dmg_maker",
  "crates/remote",
  "crates/stores/app_store_connect",
  "crates/stores/app_gallery_connect",
  "crates/stores/google_play_console",
  "apps/cli",
  "crates/studio-core",
  "apps/studio-cli",
  "apps/studio-api",
]

# The Studio Worker is checked separately for wasm32-unknown-unknown.
default-members = [
  "crates/core",
  "crates/app_analyzer",
  "crates/app_builder",
  "crates/app_packager",
  "crates/app_publisher",
  "crates/dmg_maker",
  "crates/remote",
  "crates/stores/app_store_connect",
  "crates/stores/app_gallery_connect",
  "crates/stores/google_play_console",
  "apps/cli",
  "crates/studio-core",
  "apps/studio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["LiJianying <lijy91@foxmail.com>"]
license = "MIT"

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

# The CLI is shipped as a prebuilt binary (`install.sh` / `install.ps1`), so the
# release size is user-visible. Without this profile the binary was 30 MB: 7.4 MB
# of symbol table (rustc's v0 mangling makes names long) plus un-deduplicated
# monomorphized generics. `lto` + `codegen-units = 1` remove most of the latter.
#
# Measured on aarch64-apple-darwin: 30.0 MB -> 16.8 MB. Two further knobs are
# deliberately left off because they change behaviour rather than just size:
# `panic = "abort"` (14.0 MB) turns a panicking tokio task into a whole-process
# abort, and `opt-level = "z"` (8.7 MB, combined with abort) trades runtime speed
# for size.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
