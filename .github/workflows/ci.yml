name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/cli/**"
      - "fixtures/flutter_app/**"
      - "apps/studio-*/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/cli/**"
      - "fixtures/flutter_app/**"
      - "apps/studio-*/**"
      - ".github/workflows/ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude studio-api --all-targets -- -D warnings
      - name: Run cargo check
        run: cargo check --workspace --exclude studio-api --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run native library and CLI regressions
        run: |
          cargo test -p fastforge_core -p fastforge_app_analyzer -p fastforge_app_builder -p fastforge_app_packager -p fastforge_app_publisher --lib
          cargo test -p fastforge_cli --bin fastforge
          cargo test -p fastforge_app_analyzer --test ios_analyzer
          cargo test -p fastforge_app_packager --test windows_packagers

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zlib1g-dev
      - name: Check packages and install, upgrade, remove in temporary roots
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" FASTFORGE_REQUIRE_NATIVE_TESTS=1 cargo test -p fastforge_app_packager --test linux_packagers deb_ -- --ignored --nocapture --test-threads=1
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" FASTFORGE_REQUIRE_NATIVE_TESTS=1 cargo test -p fastforge_app_packager --test linux_packagers rpm_ -- --ignored --nocapture --test-threads=1

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Rust and packaging tools
        run: pacman -Syu --noconfirm rust libarchive git
      - uses: actions/checkout@v4
      - name: Check pacman install, upgrade and remove
        env:
          FASTFORGE_REQUIRE_NATIVE_TESTS: "1"
        run: cargo test -p fastforge_app_packager --test linux_packagers pacman_follows -- --ignored --nocapture --test-threads=1

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --exclude studio-api --all-targets

  # The release workflow ships prebuilt Windows binaries, and nothing else
  # compiles this workspace for Windows, so platform-specific code can rot
  # unnoticed until a release build fails. Checks the CLI binary that the
  # release archives are cut from.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the CLI for Windows
        run: cargo check -p fastforge_cli --bin fastforge
      - name: Install Inno Setup and locate the Windows SDK
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK makeappx missing' }
          (Join-Path $sdk.FullName 'x64') | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run Windows libraries and installer regressions with disposable signing identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p fastforge_core -p fastforge_app_builder -p fastforge_app_packager -p fastforge_app_publisher --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Fastforge CI' -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -HashAlgorithm SHA256 -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}CA=false')
          $pfx = Join-Path $env:RUNNER_TEMP 'fastforge-ci.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'fastforge-ci.cer'
          try {
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString 'ci-only' -AsPlainText -Force) | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            $env:MSIX_CERTIFICATE_PATH = $pfx
            $env:MSIX_CERTIFICATE_PASSWORD = 'ci-only'
            $env:MSIX_PUBLISHER = 'CN=Fastforge CI'
            $env:FASTFORGE_TEST_MSIX_INSTALL = '1'
            cargo test -p fastforge_app_packager --test windows_native -- --ignored --nocapture --test-threads=1
            if ($LASTEXITCODE) { throw 'Windows native installer checks failed' }
          } finally {
            foreach ($store in @('CurrentUser\My', 'LocalMachine\Root', 'LocalMachine\TrustedPeople')) {
              Remove-Item "Cert:\$store\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            }
            Remove-Item $pfx, $cer -ErrorAction SilentlyContinue
          }

  flutter-desktop:
    name: Flutter desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Install Linux desktop and AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libglu1-mesa xvfb desktop-file-utils
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fL --retry 3 --max-time 120 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage"
          curl -fL --retry 3 --max-time 120 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o "$RUNNER_TEMP/appimage-tools/runtime-x86_64"
          chmod +x "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage"
          printf '#!/bin/sh\nexec "%s/appimagetool.AppImage" --appimage-extract-and-run --runtime-file "%s/runtime-x86_64" "$@"\n' "$RUNNER_TEMP/appimage-tools" "$RUNNER_TEMP/appimage-tools" > "$RUNNER_TEMP/appimage-tools/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
      - name: Build real Linux Flutter bundle
        if: runner.os == 'Linux'
        run: cargo test -p fastforge_app_builder --test flutter_builder builds_linux -- --ignored --nocapture --test-threads=1
      - name: Package, launch and replace AppImage versions
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p fastforge_app_packager --test flutter_desktop appimage_flutter -- --ignored --nocapture --test-threads=1
      - name: Build real Windows Flutter bundle
        if: runner.os == 'Windows'
        run: cargo test -p fastforge_app_builder --test flutter_builder builds_windows -- --ignored --nocapture --test-threads=1
      - name: Package and launch DMG and PKG; install and upgrade on an isolated volume
        if: runner.os == 'macOS'
        env:
          FASTFORGE_TEST_PKG_INSTALL: "1"
        run: cargo test -p fastforge_app_packager --test flutter_desktop macos_flutter -- --ignored --nocapture --test-threads=1

  studio-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check Studio Worker
        run: cargo check -p studio-api --target wasm32-unknown-unknown
