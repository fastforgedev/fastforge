# Static reference: apps/cli/tests/package_routing.rs exercises this fixture
# through the plain top-level `fastforge package` command instead (no
# flavor/module build-args needed here), so this workflow file itself isn't
# executed by a test. Kept as a documented equivalent for `fastforge workflow
# run`.
name: Gradle Builder smoke package

on:
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    steps:
      - name: Package APK
        uses: fastforge/package@v1
        with:
          platform: android
          target: apk
          output: dist/

  aab:
    name: Android AAB
    steps:
      - name: Package AAB
        uses: fastforge/package@v1
        with:
          platform: android
          target: aab
          output: dist/
